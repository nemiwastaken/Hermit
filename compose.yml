services:
  sandbox:
    build:
      context: ./sandbox
      dockerfile: ${HERMIT_SANDBOX_DOCKERFILE:-Dockerfile}
    container_name: hermit-sandbox
    restart: unless-stopped
    # No network here: internet tools run in containers without the workspace.
    network_mode: none
    user: "${HERMIT_UID:-1000}:${HERMIT_GID:-1000}"
    environment:
      HERMIT_WORKSPACE: /workspace
    volumes:
      # Own directory: if both sockets shared one mount, bash could reach net.sock
      # and use the internet the sandbox is supposed to lack. install.sh creates
      # the socket directories at install time.
      - ${HERMIT_RUN_DIR:-./.dev/run}/sandbox:/run/hermit
      - ${HERMIT_WORKSPACE:-./.dev/workspace}:/workspace
      - ${HERMIT_ATTACHMENTS_DIR:-./.dev/attachments}:/attachments:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Untrusted code runs here: without limits a fork bomb or a leak hurts the host.
    mem_limit: 1g
    pids_limit: 256
    cpus: 1.0

  net:
    build: ./net
    container_name: hermit-net
    restart: unless-stopped
    # Web search, fetch, and remote MCP. No workspace, no behavior, no database:
    # a page can only see what the model sends it.
    user: "${HERMIT_UID:-1000}:${HERMIT_GID:-1000}"
    environment:
      HERMIT_MCP_FILE: /etc/hermit/mcp.json
    volumes:
      - ${HERMIT_RUN_DIR:-./.dev/run}/net:/run/hermit
      # Remote MCP servers are configured here; secrets stay on the host.
      - ${HERMIT_MCP_CONFIG:-./.dev/mcp.json}:/etc/hermit/mcp.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m

  browser:
    build: ./browser
    container_name: hermit-browser
    restart: unless-stopped
    init: true
    user: "${HERMIT_UID:-1000}:${HERMIT_GID:-1000}"
    networks: [browser-egress]
    volumes:
      - ${HERMIT_RUN_DIR:-./.dev/run}/browser:/run/hermit
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 128
    cpus: 2.0

networks:
  browser-egress:
